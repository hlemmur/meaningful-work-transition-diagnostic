name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/career-transition-diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
        env:
          APP_MODE: mock
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          APP_MODE: mock
      - run: bun run test:e2e -- e2e/analysis.spec.ts --grep "pending state"
        env:
          APP_MODE: mock
          PLAYWRIGHT_DEV: "1"
          PLAYWRIGHT_PORT: "3013"
